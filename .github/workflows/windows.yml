name: Windows Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            msystem: MINGW64
            # 使用 MinGW 环境进行 AMD64 构建
            extra_cmake_args: "-G Ninja"
            shell: msys2 {0}
          - architecture: aarch64
            msystem: CLANGARM64
            # 使用 CLANGARM64 环境和 clang 编译器进行 ARM64 构建
            extra_cmake_args: "-G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++"
            shell: msys2 {0}

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # --- AMD64 (MINGW64) 环境配置 ---
      - name: Install Toolchain for AMD64
        if: matrix.architecture == 'amd64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
          cache: true

      # --- ARM64 (CLANGARM64) 环境配置 ---
      - name: Install Toolchain for ARM64
        if: matrix.architecture == 'aarch64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-cmake
            mingw-w64-clang-aarch64-ninja
            mingw-w64-clang-aarch64-openssl
            mingw-w64-clang-aarch64-libcurl
          pacboy: >-
            clang:p
            cmake:p
            ninja:p
            openssl:p
          cache: true

      # --- 通用构建流程 ---
      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} ${{ matrix.extra_cmake_args }}

      - name: Build
        run: |
          cmake --build build --config ${{env.BUILD_TYPE}}

      # --- 产物上传 ---
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: duckshell-windows-${{ matrix.architecture }}
          path: |
            build/*.exe
            build/Release/*.exe
          if-no-files-found: warn

      # --- 兼容性清理步骤 (可选) ---
      # 只有当你使用自托管服务器或有极大的磁盘压力时才需要此步
      - name: Clean build directory
        if: always()
        run: |
          rm -rf build