name: Windows Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            msystem: MINGW64
            # 使用 MinGW 环境进行 AMD64 构建
            extra_cmake_args: "-G Ninja"
            shell: msys2 {0}
          - architecture: aarch64
            # 使用 LLVM-MinGW 交叉编译 ARM64，避免 MSYS2 头文件不兼容问题
            extra_cmake_args: "-G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/windows-arm64-toolchain.cmake"
            shell: cmd

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # --- AMD64 (MINGW64) 环境配置 ---
      - name: Install Toolchain for AMD64
        if: matrix.architecture == 'amd64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
          cache: true

      # --- ARM64 (LLVM-MinGW 交叉编译) 环境配置 ---
      - name: Install LLVM-MinGW for ARM64
        if: matrix.architecture == 'aarch64'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/20261104/llvm-mingw-20261104-ucrt-x86_64.zip" -OutFile "llvm-mingw.zip"
          Expand-Archive -Path "llvm-mingw.zip" -DestinationPath "."
          Rename-Item -Path "llvm-mingw-20261104-ucrt-x86_64" -NewName "llvm-mingw"
          echo "LLVM_MINGW_PATH=$PWD\llvm-mingw" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & llvm-mingw\bin\aarch64-w64-mingw32-clang.exe --version

      - name: Install CMake and Ninja for ARM64
        if: matrix.architecture == 'aarch64'
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: 'latest'
          ninja: true

      # --- 通用构建流程 ---
      - name: Configure CMake
        run: |
          ${{ matrix.architecture == 'aarch64' && 'set PATH=%LLVM_MINGW_PATH%\bin;%PATH%' || '' }}
          cmake -B build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} ${{ matrix.extra_cmake_args }}

      - name: Build
        run: |
          ${{ matrix.architecture == 'aarch64' && 'set PATH=%LLVM_MINGW_PATH%\bin;%PATH%' || '' }}
          cmake --build build --config ${{env.BUILD_TYPE}}

      # --- 产物上传 ---
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: duckshell-windows-${{ matrix.architecture }}
          path: |
            build/*.exe
            build/Release/*.exe
          if-no-files-found: warn

      # --- 兼容性清理步骤 (可选) ---
      # 只有当你使用自托管服务器或有极大的磁盘压力时才需要此步
      - name: Clean build directory
        if: always()
        run: |
          ${{ matrix.architecture == 'aarch64' && 'if exist build rmdir /s /q build' || 'rm -rf build' }}